# Usługa wewnątrz klastra, bez Ingressu i bez load balancera.
# Z laptopa dostajesz się do niej przez:
#   kubectl port-forward -n $UCZESTNIK svc/quotes-api-d1 8080:80
apiVersion: v1
kind: Service
metadata:
  name: quotes-api-d1
  labels:
    app: quotes-api-d1
    szkolenie/dzien: "1"
spec:
  type: ClusterIP
  selector:
    app: quotes-api-d1
  ports:
    - port: 80
      targetPort: 8000
